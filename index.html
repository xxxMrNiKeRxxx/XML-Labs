<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniLibria - Видео хостинг аниме</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #ff5a78;
            --dark: #0a0a12;
            --darker: #050508;
            --accent: #6c5ce7;
            --card-bg: rgba(30, 30, 46, 0.7);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: white;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://i.pinimg.com/originals/0f/67/6a/0f676a0a5d9b780a488a9b8a5f4c46d2.jpg');
            background-attachment: fixed;
            background-size: cover;
        }
        
        .header {
            background: rgba(10, 10, 18, 0.9);
            padding: 15px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--primary);
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }
        
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 5%;
        }
        
        .anime-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,90,120,0.2);
            backdrop-filter: blur(5px);
        }
        
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--primary);
        }
        
        .anime-cover {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        
        .anime-info {
            padding: 15px;
        }
        
        .anime-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .anime-page {
            padding: 20px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .anime-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .back-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 20px 5%;
        }


        .controls-container {
                display: flex;
                gap: 15px;
                padding: 20px 5%;
                background: rgba(10, 10, 18, 0.7);
                border-radius: 10px;
                margin: 0 5% 20px;
                flex-wrap: wrap;
        }

        .control-btn {
                background: var(--primary);
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                gap: 8px;
        }  

        
        .search-container {
            margin: 20px 5%;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 25px;
            background: rgba(30, 30, 46, 0.7);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .search-input:focus {
            box-shadow: 0 0 10px rgba(255, 90, 120, 0.5);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 0 0 10px 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-result-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        

        .search-result-item:hover {
            background: rgba(255, 90, 120, 0.2);
        } 

        .control-btn:hover {
                background: #ff3d60;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(255, 90, 120, 0.4);
        }

        .delete-btn {
                background: #ff4b4b;
        }

        .episode-badge {
                background: var(--accent);
                color: white;
                padding: 3px 8px;
                border-radius: 10px;
                font-size: 12px;
                font-weight: bold;
        }
        @media (max-width: 768px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .anime-cover {
                height: 200px;
            }
        }
        .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(5px);
    }
    
    .modal-content {
        background: var(--darker);
        margin: 5% auto;
        padding: 25px;
        border: 1px solid var(--primary);
        border-radius: 10px;
        max-width: 500px;
        animation: modalFade 0.3s;
    }
    
    @keyframes modalFade {
        from {opacity: 0; transform: translateY(-50px);}
        to {opacity: 1; transform: translateY(0);}
    }
    
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        cursor: pointer;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 10px;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--primary);
        border-radius: 5px;
        color: white;
    }
    
    .modal-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    .anime-card {
    position: relative;
    /* остальные ваши стили карточки */
}

.delete-button {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: #ff4444;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

.delete-button:hover {
    background-color: #cc0000;
}
    
    .episode-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        margin: 5px;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .episode-btn:hover {
        background: #7d6ae8;
    }
</style>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">AniLibria</a>
    </header>

    <div id="root">
  
    </div>

    <script src="main.js" type="module"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Добавить новое аниме</h2>
            <form id="anime-form">
                <div class="form-group">
                    <label>Название:</label>
                    <input type="text" id="anime-title" required>
                </div>
                <div class="form-group">
                    <label>Описание:</label>
                    <textarea id="anime-description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Количество серий:</label>
                    <input type="number" id="anime-episodes" min="1" required>
                </div>
                <div class="form-group">
                    <label>Ссылка на обложку:</label>
                    <input type="url" id="anime-image" required>
                </div>
                <button type="submit" class="modal-btn">Добавить</button>
            </form>
        </div>
    </div>
</body>
</html>
