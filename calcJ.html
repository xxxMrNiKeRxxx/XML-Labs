<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="calcJ.css"> 
  <script type="text/javascript" src="calc.js"></script> 
</head>

<body style="font-family: sans-serif">
  <div class="calculator">
    <button class="theme-button" onclick="toggleTheme()">Сменить тему</button>
    <button class="theme-button" onclick="changeResultColor()">Цвет экрана</button>

    <!-- Поле с выпадающим списком -->
    <select>
      <option value="option1">Опция 1</option>
      <option value="option2">Опция 2</option>
      <option value="option3">Опция 3</option>
      <option value="option4">Опция 4</option>
    </select>

    <details>
      <summary>Автор</summary>
      <p>Герасимович Никита Иванович</p>
      <p>ИУ5-45Б</p>
    </details>

    <p class="objective">Цель: <span class="highlight">Знакомство</span> с <span class="highlight">HTML</span> и <span class="highlight">CSS</span>.</p>
    <a href="https://github.com/xxxMrNiKeRxxx?tab=repositories" target="_blank">
      <button class="theme-button">GitHub</button>
    </a>
    <div class="footer">ЛР выполнена Герасимовичем Никитой Ивановичем</div>
  </div>

  <div>
    <div id="result" class="result">0</div>
    <div id="physics-instruction" class="instruction"></div>
    
    <div class="buttons-grid">
      <div class="button-row">
        <button id="btn_op_clear" class="my-btn secondary">C</button>
        <button id="btn_op_back" class="my-btn secondary">⌫</button>
        <button id="btn_op_sqrt" class="my-btn secondary">√</button>
        <button id="btn_op_div" class="my-btn secondary">/</button>
        <button id="btn_accumulate" class="my-btn primary">Σ±</button>
      </div>

      <div class="button-row">
        <button id="btn_digit_7" class="my-btn">7</button>
        <button id="btn_digit_8" class="my-btn">8</button>
        <button id="btn_digit_9" class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn primary">×</button>
        <button id="btn_op_square" class="my-btn primary">x²</button>
      </div>

      <div class="button-row">
        <button id="btn_digit_4" class="my-btn">4</button>
        <button id="btn_digit_5" class="my-btn">5</button>
        <button id="btn_digit_6" class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn primary">-</button>
        <button id="btn_op_factorial" class="my-btn primary">x!</button>
      </div>
      
      <div class="button-row">
        <button id="btn_digit_1" class="my-btn">1</button>
        <button id="btn_digit_2" class="my-btn">2</button>
        <button id="btn_digit_3" class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn primary">+</button>
        <button id="btn_physics" class="my-btn primary">L<sub>moon</sub></button>
      </div>

      <div class="button-row">
        <button id="btn_digit_0" class="my-btn">0</button>
        <button id="btn_triple_zero" class="my-btn">000</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn primary execute">=</button>
      </div>

      
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-theme");
      const buttons = document.querySelectorAll('.my-btn');
      buttons.forEach(btn => {
        btn.classList.toggle("dark-theme-btn");
      });
    }
  </script>
</body>
</html>
